name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, mbstring, sqlite3, mysqli, curl, json
          coverage: none

      - name: Validate Composer
        run: composer validate --strict

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer Audit
        run: composer audit

      - name: PHP Lint
        run: |
          git ls-files "*.php" | xargs -n 1 -P 4 php -l

      - name: PHPUnit
        env:
          CI_ENVIRONMENT: testing
        run: vendor/bin/phpunit --no-coverage --colors=never
